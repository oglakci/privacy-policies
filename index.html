<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0A0A0A; color: #fff; min-height: 100vh; padding: 48px 20px; }
  .container { max-width: 680px; margin: 0 auto; }
  .header { margin-bottom: 56px; }
  .header p { color: #444; font-size: 13px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; }
  .header h1 { font-size: 36px; font-weight: 700; letter-spacing: -1px; }
  .header span { color: #444; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 48px; }
  .app { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 16px 24px; background: #111; border: 1px solid #1e1e1e; border-radius: 20px; text-decoration: none; color: #fff; transition: all 0.2s; text-align: center; gap: 12px; }
  .app:hover { background: #161616; border-color: #2a2a2a; transform: translateY(-2px); }
  .icon-wrap { width: 56px; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
  .app h2 { font-size: 14px; font-weight: 600; }
  .app span { font-size: 11px; color: #555; }
  @media (max-width: 480px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  .footer-links { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
  .footer-links a { color: #444; text-decoration: none; font-size: 13px; transition: color 0.2s; }
  .footer-links a:hover { color: #888; }
  .divider { width: 4px; height: 4px; background: #333; border-radius: 50%; align-self: center; }
</style>
</head>
