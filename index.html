<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yasar Oglakci — Uygulamalar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0A0A0A; color: #fff; min-height: 100vh; padding: 40px 16px; }
  .container { max-width: 720px; margin: 0 auto; }
  .header { margin-bottom: 48px; text-align: center; }
  .header h1 { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
  .header p { color: #666; font-size: 15px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .app { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 16px; background: #141414; border: 1px solid #222; border-radius: 20px; text-decoration: none; color: #fff; transition: background 0.2s, border-color 0.2s, transform 0.2s; text-align: center; }
  .app:hover { background: #1a1a1a; border-color: #333; transform: translateY(-2px); }
  .icon { width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 14px; }
  .app h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .app span { font-size: 12px; color: #555; line-height: 1.4; }
  @media (max-width: 480px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  footer { margin-top: 48px; text-align: center; font-size: 13px; color: #444; }
  footer a { color: #666; text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Yasar Oglakci</h1>
    <p>Gizlilik politikaları ve uygulama bilgileri</p>
  </div>
  <div class="grid">
    <a class="app" href="debtly.html">
      <div class="icon" style="background:#0D2E1E;">💳</div>
      <h2>Debtly</h2>
      <span>Borç takip</span>
    </a>
    <a class="app" href="kasa.html">
      <div class="icon" style="background:#2E1F00;">🔐</div>
      <h2>Kasa</h2>
      <span>Fiş ve garanti</span>
    </a>
    <a class="app" href="falhanim.html">
      <div class="icon" style="background:#1A0F30;">🔮</div>
      <h2>Falhanım</h2>
      <span>Fal uygulaması</span>
    </a>
    <a class="app" href="gebeyim.html">
      <div class="icon" style="background:#2E0A10;">🤰</div>
      <h2>Gebeyim!</h2>
      <span>Gebelik takip</span>
    </a>
    <a class="app" href="biparmak.html">
      <div class="icon" style="background:#2E1500;">👆</div>
      <h2>Bi'Parmak</h2>
      <span>Hareket ipuçları</span>
    </a>
    <a class="app" href="yaprak.html">
      <div class="icon" style="background:#0A1F14;">🌿</div>
      <h2>Yaprak</h2>
      <span>Not ve günlük</span>
    </a>
    <a class="app" href="glug.html">
      <div class="icon" style="background:#021A18;">🐟</div>
      <h2>Glug</h2>
      <span>Su takip</span>
    </a>
  </div>
  <footer>
    <p>© 2026 Yasar Oglakci · <a href="mailto:oglakcci@gmail.com">oglakcci@gmail.com</a></p>
  </footer>
</div>
</body>
</html>
